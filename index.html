
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #080d18;
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 35px 28px;
            background: #111a2b;
            border: 1px solid #26354d;
            border-radius: 18px;
            box-shadow: 0 15px 40px #0008;
        }

        h2 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #334155;
            border-radius: 9px;
            background: #080d18;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #38bdf8;
            color: #08111d;
            font-weight: bold;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-size: 15px;
        }

        .submit-btn:hover {
            background: #0ea5e9;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .success {
            color: #4ade80;
        }

        .failed {
            color: #fb7185;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to continue</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit" class="submit-btn">
                Login
            </button>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <p class="footer">Mysterious</p>
    </div>

    <script>
        const correctEmail = "admin@gmail.com";
        const correctPassword = "12345";

        document.getElementById("loginForm").addEventListener(
            "submit", function(event) {
                event.preventDefault();

                const email = document.getElementById("email")
                    .value.trim();

                const password = document.getElementById("password")
                    .value;

                const message = document.getElementById("message");

                if (
                    email === correctEmail &&
                    password === correctPassword
                ) {
                    message.textContent =
                        "SUCCESS ✅ Login successful!";
                    message.className = "success";
                } else {
                    message.textContent =
                        "FAILED ❌ Incorrect email or password.";
                    message.className = "failed";
                }
            }
        );
    </script>
</body>
</html>
